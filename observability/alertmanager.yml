global:
  resolve_timeout: 5m

route:
  receiver: feishu-alerts
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: feishu-alerts
    webhook_configs:
      - url: http://alert-relay:8082/alertmanager
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, service]

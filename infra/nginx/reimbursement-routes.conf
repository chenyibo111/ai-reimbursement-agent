server {
    listen 80;
    server_name _;

    # Docker service IPs change whenever a container is recreated. Resolving
    # upstream names at request time keeps the edge connected after a targeted
    # API or web rebuild without requiring an edge restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_bff_upstream web:3000;
    set $reimbursement_api_upstream reimbursement-api:8080;
    set $reimbursement_web_upstream reimbursement-web:8080;

    # Provisioning is container-private. Do not proxy this namespace publicly.
    location ^~ /internal/ {
        return 404;
    }

    location ^~ /api/auth/ {
        proxy_pass http://$auth_bff_upstream;
        # Preserve the browser's explicit edge port (for example :8088).  Next
        # uses it when constructing the OAuth callback's final redirect.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/v1/ {
        proxy_pass http://$reimbursement_api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://$reimbursement_web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

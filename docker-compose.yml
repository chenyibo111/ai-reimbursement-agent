services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    entrypoint: ["/bin/sh", "-c", "set -a; . /run/secrets/app_env; set +a; exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["postgres"]
    secrets:
      - app_env
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-reimbursement}
      POSTGRES_USER: ${POSTGRES_USER_NAME:-reimbursement}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio:latest
    entrypoint: ["/bin/sh", "-c", "set -a; . /run/secrets/app_env; set +a; export MINIO_ROOT_USER=\"$${MINIO_ROOT_USER:-$${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}}\" MINIO_ROOT_PASSWORD=\"$${MINIO_ROOT_PASSWORD:-$${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}}\"; exec minio server /data --console-address :9001"]
    secrets:
      - app_env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:latest
    secrets:
      - app_env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "set -a; . /run/secrets/app_env; set +a;
      export MINIO_ROOT_USER=\"$${MINIO_ROOT_USER:-$${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}}\" MINIO_ROOT_PASSWORD=\"$${MINIO_ROOT_PASSWORD:-$${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}}\";
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing local/$$S3_BUCKET"

  clamav:
    image: clamav/clamav:stable_base
    ports:
      - "3310:3310"

  ocr:
    build: ./ocr-service
    volumes:
      - ocr-models:/root/.paddlex
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  embedding-service:
    build: ./embedding-service
    profiles: ["knowledge"]
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      MODEL_CACHE_DIR: /models
    expose:
      - "8080"
    volumes:
      - embedding-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: .
    command: npm run start
    entrypoint: ["node", "/app/scripts/docker-runtime.mjs"]
    secrets:
      - app_env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ocr:
        condition: service_healthy
      clamav:
        condition: service_started
    restart: unless-stopped

  feishu-bot-worker:
    build: .
    command: npm run feishu:worker:container
    entrypoint: ["node", "/app/scripts/docker-runtime.mjs"]
    secrets:
      - app_env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ocr:
        condition: service_healthy
      clamav:
        condition: service_started
    restart: unless-stopped

  job-worker:
    build: .
    command: npm run job:worker:container
    entrypoint: ["node", "/app/scripts/docker-runtime.mjs"]
    secrets:
      - app_env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ocr:
        condition: service_healthy
      clamav:
        condition: service_started
    restart: unless-stopped

  reimbursement-api:
    build: ./services/reimbursement-api
    profiles: ["migration"]
    environment:
      REIMBURSEMENT_DATABASE_URL: ${REIMBURSEMENT_DATABASE_URL:-}
    secrets:
      - app_env
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    profiles: ["observability"]
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
      - ./observability/loki-rules.yml:/etc/loki/rules/fake/loki-rules.yml:ro
    depends_on:
      alertmanager:
        condition: service_started
    expose:
      - "3100"
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  alert-relay:
    build: .
    profiles: ["observability"]
    command: npm run alert:relay:container
    entrypoint: ["node", "/app/scripts/docker-runtime.mjs"]
    secrets:
      - app_env
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.28.1
    profiles: ["observability"]
    command: --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    expose:
      - "9093"
    depends_on:
      alert-relay:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    profiles: ["observability"]
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-admin-password-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_started
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  ocr-models:
  embedding-models:
  loki-data:
  grafana-data:

secrets:
  app_env:
    file: .env.local

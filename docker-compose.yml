services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reimbursement
      POSTGRES_USER: reimbursement
      POSTGRES_PASSWORD: reimbursement
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reimbursement
      MINIO_ROOT_PASSWORD: reimbursement-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 reimbursement reimbursement-local-only; do sleep 1; done;
      mc mb --ignore-existing local/reimbursement-private"

  clamav:
    image: clamav/clamav:stable_base
    ports:
      - "3310:3310"

  ocr:
    build: ./ocr-service
    volumes:
      - ocr-models:/root/.paddlex
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  minio-data:
  ocr-models:

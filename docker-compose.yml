services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reimbursement
      POSTGRES_USER: reimbursement
      POSTGRES_PASSWORD: reimbursement
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reimbursement
      MINIO_ROOT_PASSWORD: reimbursement-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  clamav:
    image: clamav/clamav:stable_base
    ports:
      - "3310:3310"

volumes:
  postgres-data:
  minio-data:

openapi: 3.1.0
info:
  title: AI Reimbursement API
  version: 1.0.0
paths:
  /api/v1/claims:
    get:
      operationId: listClaims
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Actor-owned claim page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Claim" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createClaim
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose: { type: string, minLength: 1 }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/claims/{claimId}:
    get:
      operationId: getClaim
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: Actor-owned claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/claims/{claimId}/uploads:
    post:
      operationId: createUploadSession
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType, sizeBytes]
              properties:
                filename: { type: string }
                contentType: { type: string, enum: [image/jpeg, image/png, application/pdf] }
                sizeBytes: { type: integer, minimum: 1, maximum: 20971520 }
      responses:
        "201":
          description: Upload session created
        default:
          $ref: "#/components/responses/Error"
  /api/v1/claims/{claimId}/receipts:
    post:
      operationId: finalizeReceiptUpload
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiptId]
              properties:
                receiptId: { type: string }
      responses:
        "202":
          description: Receipt accepted for extraction
        default:
          $ref: "#/components/responses/Error"
  /api/v1/claims/{claimId}/validation:
    get:
      operationId: getClaimValidation
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: Current validation result
          content:
            application/json:
              schema:
                type: object
                required: [issues]
                properties:
                  issues:
                    type: array
                    items:
                      $ref: "#/components/schemas/ValidationIssue"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/claims/{claimId}/submission-requests:
    post:
      operationId: requestSubmission
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Submission confirmation issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionRequest"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/claims/{claimId}/submit:
    post:
      operationId: submitClaim
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmationToken]
              properties:
                confirmationToken: { type: string }
      responses:
        "201":
          description: Claim submitted
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Error:
      description: Safe business error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Claim:
      type: object
      required: [id, ownerId, status, version, purpose, participants, createdAt, updatedAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [DRAFT, PROCESSING, NEEDS_INFORMATION, AWAITING_CONFIRMATION, SUBMITTED]
        version:
          type: integer
          minimum: 0
        purpose:
          type: [string, "null"]
        ownerId: { type: string }
        expenseCategory: { type: [string, "null"] }
        participants:
          type: array
          items: { type: string }
        projectCode: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Receipt:
      type: object
      required: [id, claimId, status, originalFilename]
      properties:
        id:
          type: string
        claimId:
          type: string
        status:
          type: string
          enum: [PENDING, EXTRACTING, EXTRACTED, FAILED]
        originalFilename:
          type: string
    ValidationIssue:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [BLOCKING, WARNING]
        message:
          type: string
    SubmissionRequest:
      type: object
      required: [confirmationToken, claimId, claimVersion, policyVersion, expiresAt]
      properties:
        confirmationToken:
          type: string
        claimId:
          type: string
        claimVersion:
          type: integer
        policyVersion:
          type: string
        expiresAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
